# Copy to /etc/nginx/sites-available/stemmantra.com, symlink into sites-enabled,
# then:  certbot --nginx -d stemmantra.com -d www.stemmantra.com
# Next.js listens on 127.0.0.1:3002 (docker-compose.yml). Ports 3000/3001 belong to LMS / TinkerGyan.

upstream stemmantra_web { server 127.0.0.1:3002; keepalive 16; }
# upstream stemmantra_api { server 127.0.0.1:5000; }   # enable when the new backend exists

server {
    listen 80;
    server_name stemmantra.com www.stemmantra.com;
    return 301 https://www.stemmantra.com$request_uri;
}

# Apex -> www (certificates added by certbot)
server {
    listen 443 ssl;
    http2 on;
    server_name stemmantra.com;
    ssl_certificate     /etc/letsencrypt/live/stemmantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stemmantra.com/privkey.pem;
    return 301 https://www.stemmantra.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.stemmantra.com;

    ssl_certificate     /etc/letsencrypt/live/stemmantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stemmantra.com/privkey.pem;

    client_max_body_size 25M;   # admin image uploads (raise if needed)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # location /api/ {
    #     proxy_pass http://stemmantra_api;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location /_next/static/ {
        proxy_pass http://stemmantra_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://stemmantra_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
