# www.stemmantra.com — STEMmantra website (pages, /api, /media, /admin: all one app)
#
# HTTPS for www.stemmantra.com. Install AFTER stemmantra.com-http.conf and the certificate (see README).
# The app listens on 127.0.0.1:3002 (docker-compose.yml). Ports 3000/3001 belong to LMS / TinkerGyan.

# Disk cache for uploaded images (/media/...). Every upload gets a new unique URL, so a cached copy
# is never out of date. Entries are re-checked with the app daily (cheap ETag revalidation), so an
# image deleted in the admin stops being served within a day.
proxy_cache_path /var/cache/nginx/stemmantra_media levels=1:2 keys_zone=stemmantra_media:10m
                 max_size=2g inactive=30d use_temp_path=off;

upstream stemmantra_site { server 127.0.0.1:3002; keepalive 16; }

# Apex -> www
server {
    listen 443 ssl http2;   # works on every nginx version (Ubuntu ships 1.18 / 1.24)
    server_name stemmantra.com;
    ssl_certificate     /etc/letsencrypt/live/stemmantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stemmantra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.stemmantra.com$request_uri;
}

server {
    listen 443 ssl http2;   # works on every nginx version (Ubuntu ships 1.18 / 1.24)
    server_name www.stemmantra.com;

    ssl_certificate     /etc/letsencrypt/live/stemmantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stemmantra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Admin image uploads are capped at 15 MB by the app (MAX_UPLOAD_MB).
    client_max_body_size 20M;

    # X-Frame-Options, X-Content-Type-Options and Referrer-Policy are set by the app (helmet).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app already compresses its responses; this only covers anything sent uncompressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /media/ {
        proxy_pass http://stemmantra_site;
        proxy_cache stemmantra_media;
        # The app sends "max-age=1 year, immutable" for browsers; nginx keeps its own shorter rule.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://stemmantra_site;
    }
}
