# Port 80 for stemmantra.com / www.stemmantra.com — permanent, install this FIRST.
#   - serves Let's Encrypt validation + automatic renewals (webroot /var/www/certbot)
#   - redirects everything else to https://www.stemmantra.com
# The HTTPS server blocks live in stemmantra.com.conf (installed after the certificate exists).
server {
    listen 80;
    listen [::]:80;
    server_name stemmantra.com www.stemmantra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.stemmantra.com$request_uri;
    }
}
