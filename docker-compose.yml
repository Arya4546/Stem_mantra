# Runs on the VPS in /opt/stemmantra-site (see .github/workflows/deploy.yml).
# The image is built in GitHub Actions and pulled from GHCR - the VPS never builds.
# The API + Postgres services will be added here when the new backend is written.
services:
  web:
    image: ghcr.io/arya4546/stem_mantra-web:${IMAGE_TAG:-latest}
    container_name: stemmantra_web
    restart: always
    ports:
      - "127.0.0.1:3002:3000"   # nginx on the host proxies to this
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
